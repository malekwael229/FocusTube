<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">FocusTube interface overview</title><desc id="desc">Three centered FocusTube interface panels showing the popup, Instagram mode controls, and options.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset=".58" stop-color="#0d2538"/><stop offset="1" stop-color="#071321"/></linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#5aa7d8" stroke-opacity=".11"/></pattern>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#00d9e8"/><stop offset="1" stop-color="#46b8ff"/></linearGradient>
  <linearGradient id="red" x1="0" x2="1"><stop stop-color="#ff4f57"/><stop offset="1" stop-color="#ff7a7f"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity=".28"/></filter>
  <style>
    text{font-family:Inter,Segoe UI,Arial,sans-serif}.w{fill:#f6fbff}.m{fill:#9aa8b7}.c{fill:#00d9e8}.b{font-weight:700}.sb{font-weight:600}.tiny{font-size:11px}.small{font-size:14px}.body{font-size:16px}.head{font-size:22px;font-weight:800}.panel{fill:#101d2b;stroke:#29445a;stroke-width:1.5}.card{fill:#142438;stroke:#243d52;stroke-width:1}.line{stroke:#2b4154;stroke-width:1}.pill{fill:#243545}.toggle{fill:#25c7ee}.off{fill:#4a4d51}.warn{fill:#554426;stroke:#b47a15;stroke-width:1.2}.mode{fill:#343638;stroke:#4d5155;stroke-width:1}.icon{fill:#193b59}.circle{fill:#23384a;stroke:#466074;stroke-width:1}.badgeS{fill:#ff4f57}.badgeW{fill:#ffb129}.badgeP{fill:#46b8ff}
  </style>
</defs>
<rect width="1280" height="800" rx="24" fill="url(#bg)"/><rect width="1280" height="800" rx="24" fill="url(#grid)"/>
<path d="M760 160L1280 0V455L932 602Z" fill="#5da8e0" opacity=".09"/>
