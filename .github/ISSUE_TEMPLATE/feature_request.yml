name: Feature request
description: Suggest an improvement
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: Describe the problem first. FocusTube avoids telemetry, remote backends, and unnecessary permissions.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What distraction, workflow, or compatibility problem would this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should FocusTube do from the user's perspective?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds
      description: Optional. Mention anything you already tried.
