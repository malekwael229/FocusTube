name: Feature request
description: Suggest a focused, privacy-preserving improvement
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: FocusTube avoids telemetry, remote backends, unnecessary permissions, and unrelated complexity. Please explain the user problem before proposing implementation details.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What distraction, workflow, or compatibility problem would this address?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe what FocusTube should do from the user's perspective.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Mention workarounds or simpler approaches if relevant.

  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      options:
        - label: This request does not require analytics or telemetry.
          required: true
        - label: This request does not require a project-controlled remote backend.
          required: true
        - label: I understand new permissions require a clear documented need.
          required: true
