name: Bug report
description: Report a reproducible FocusTube bug
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve FocusTube. Do not include passwords, secrets, private browsing data, or sensitive security details in a public issue.

  - type: input
    id: version
    attributes:
      label: FocusTube version
      placeholder: 2.3.2
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 152, Edge 152, Firefox 142
    validations:
      required: true

  - type: input
    id: site
    attributes:
      label: Affected site or route
      placeholder: YouTube Shorts, Instagram Reels, etc.
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: FocusTube mode
      options:
        - Strict
        - Warn
        - Passive
        - Timer work mode
        - Timer break mode
        - Not sure / not applicable
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the smallest reliable sequence that triggers the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Screenshots or recordings are welcome if they contain no sensitive information.
