<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc">
<title id="title">YouTube before and after FocusTube</title><desc id="desc">A side-by-side vector comparison showing YouTube Shorts before FocusTube and a cleaner recommended-video view after FocusTube hides Shorts surfaces.</desc>
